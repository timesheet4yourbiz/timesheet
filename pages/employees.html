<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - WorkTime</title>
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Gaya Tabs */
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; background: #f8fafc; border-radius: 8px 8px 0 0; overflow: hidden; }
        .tab-btn { padding: 0.8rem 1.5rem; cursor: pointer; border: none; background: transparent; font-weight: 500; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
        .tab-btn:hover { color: var(--text-main); background: #f1f5f9; }
        .tab-btn.active { color: var(--text-main); background: white; border-top: 2px solid #03a9f4; border-right: 1px solid var(--border-color); border-left: 1px solid var(--border-color); margin-bottom: -1px; }
        
        /* Gaya Sembunyikan Tab */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Action Bar (Butang Add & Search) */
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .group-add-form { display: flex; gap: 0; }
        .group-add-form input { padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 4px 0 0 4px; font-family: inherit; font-size: 0.85rem; width: 250px; outline: none; }
        .group-add-form button { background: #03a9f4; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 0 4px 4px 0; font-weight: 600; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h3>Team</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                
                <!-- Butang Tab -->
                <div class="tabs">
                    <button class="tab-btn active" data-target="membersTab">Members</button>
                    <button class="tab-btn" data-target="groupsTab">Groups</button>
                </div>

                <!-- KANDUNGAN: MEMBERS TAB -->
                <div id="membersTab" class="tab-content active">
                    <div class="action-bar" style="justify-content: flex-end;">
                        <button id="addMemberBtn" class="btn-primary" style="background-color: #03a9f4 !important;">ADD NEW MEMBER</button>
                    </div>
                    <div class="card" style="padding: 0;">
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-color); color: #94a3b8; text-transform: uppercase; font-size: 0.75rem;">
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Name</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Email</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Billable Rate (MYR)</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Role</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Group</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600; width: 60px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="membersList">
                                    <tr><td colspan="6" style="padding: 1.5rem; text-align: center;">Loading members...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- KANDUNGAN: GROUPS TAB -->
                <div id="groupsTab" class="tab-content">
                    <div class="action-bar" style="justify-content: flex-end;">
                        <div class="group-add-form">
                            <input type="text" id="newGroupName" placeholder="Add new group">
                            <button id="addGroupBtn">ADD</button>
                        </div>
                    </div>
                    <div class="card" style="padding: 0;">
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-color); color: #94a3b8; text-transform: uppercase; font-size: 0.75rem;">
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Name</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600;">Access</th>
                                        <th style="padding: 1rem 1.5rem; font-weight: 600; width: 80px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="groupsList">
                                    <tr><td colspan="3" style="padding: 1.5rem; text-align: center;">Loading groups...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="../js/employees.js"></script>
</body>
</html>
