<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - WorkTime</title>
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <!-- Main Content -->
        <main class="main-content">
    <header class="topbar">
        <h3>Team Management</h3>
        <span id="userEmail" class="user-info">Loading...</span>
    </header>

    <div class="content-area">
        <div class="card" style="padding: 1.5rem; background: white; border-radius: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h4 style="margin:0; color: var(--text-muted); font-size: 0.9rem;">EMPLOYEE DIRECTORY</h4>
            </div>
            
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 1px solid var(--border-color); background: #f8fafc;">
                        <th style="padding: 0.75rem;">Email Address</th>
                        <th style="padding: 0.75rem;">Role</th>
                        <th style="padding: 0.75rem;">Status</th>
                        <th style="padding: 0.75rem; text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- Data masuk dari JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>
    </div>

    <script type="module" src="../js/employees.js"></script>
</body>
</html>
