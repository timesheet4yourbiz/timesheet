<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - WorkTime</title>
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <!-- Main Content -->
        <main class="main-content">
    <header class="topbar">
        <h3>Team Management</h3>
        <span id="userEmail" class="user-info">Loading...</span>
    </header>

    <div class="content-area">
        <div class="card" style="padding: 1.5rem; background: white; border-radius: 8px;">
            
            <!-- Bahagian Kawalan (Carian & Butang Pukal) -->
            <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <input type="text" id="searchInput" placeholder="🔍 Search email or role..." style="padding: 0.6rem 1rem; border: 1px solid var(--border-color); border-radius: 6px; flex: 1; min-width: 250px;">
                <div style="display: flex; gap: 0.5rem;">
                    <button id="bulkApproveBtn" style="background: #10b981; color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 500;">✔ Approve Selected</button>
                    <button id="bulkDeleteBtn" style="background: #ef4444; color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 500;">✖ Delete Selected</button>
                </div>
            </div>
            
            <!-- Jadual Pekerja -->
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 1px solid var(--border-color); background: #f8fafc;">
                        <th style="padding: 0.75rem; width: 40px;"><input type="checkbox" id="selectAllCheckbox"></th>
                        <th style="padding: 0.75rem;">Email Address</th>
                        <th style="padding: 0.75rem;">Role</th>
                        <th style="padding: 0.75rem;">Status</th>
                        <th style="padding: 0.75rem; text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- Data ditarik oleh JS -->
                </tbody>
            </table>
        </div>
    </div>
        </main>
    </div>

    <script type="module" src="../js/employees.js"></script>
</body>
</html>
