<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WorkTime</title>
    <!-- Rujuk kepada style.css utama -->
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="sidebar-container"></div>
        
    <div class="main-content">
        <!-- TOP HEADER -->
        <div class="top-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px;">
            <h1 class="page-title" style="margin: 0; font-size: 1.5rem; color: #0f172a; font-weight: 600;">Dashboard</h1>
            
            <div class="header-controls" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <!-- Dropdown Project -->
                <select id="filterProject" style="padding: 8px 15px; border: 1px solid #cbd5e1; border-radius: 4px; color: #475569; outline: none; background: white;">
                    <option value="ALL">All Projects</option>
                </select>
                
                <!-- Dropdown Team -->
                <select id="filterTeam" style="padding: 8px 15px; border: 1px solid #cbd5e1; border-radius: 4px; color: #475569; outline: none; background: white;">
                    <option value="ALL">All Teams</option>
                </select>
                
                <!-- Kotak Tarikh & Butang Next/Prev -->
                <div style="display: flex; border: 1px solid #cbd5e1; border-radius: 4px; background: white; overflow: hidden; align-items: center;">
                    <div style="padding: 8px 15px; border-right: 1px solid #cbd5e1; color: #475569; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
                        📅 <span id="dashDateRangeText">Memuatkan...</span>
                    </div>
                    <button id="prevDashBtn" style="padding: 8px 12px; background: white; border: none; border-right: 1px solid #cbd5e1; cursor: pointer; color: #64748b; font-weight: bold;">&lt;</button>
                    <button id="nextDashBtn" style="padding: 8px 12px; background: white; border: none; cursor: pointer; color: #64748b; font-weight: bold;">&gt;</button>
                </div>
            </div>
        </div>

        <!-- SUMMARY KPI -->
        <div class="kpi-section" style="display: flex; gap: 24px; margin-bottom: 24px; background: white; padding: 16px 24px; border-radius: 6px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
            <div class="kpi-item" style="flex: 1; border-right: 1px solid #e2e8f0;">
                <div class="kpi-label" style="font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;">Total Time</div>
                <div class="kpi-value" id="kpiTotalTime" style="font-size: 1.5rem; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">--:--</div>
            </div>
            <div class="kpi-item" style="flex: 1; border-right: 1px solid #e2e8f0;">
                <div class="kpi-label" style="font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;">Top Project</div>
                <div class="kpi-value" id="kpiTopProject" style="font-size: 1.5rem; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">--</div>
            </div>
            <div class="kpi-item" style="flex: 1;">
                <div class="kpi-label" style="font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;">Top Client</div>
                <div class="kpi-value" id="kpiTopClient" style="font-size: 1.5rem; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">--</div>
            </div>
        </div>

        <!-- MAIN CHART -->
        <div class="chart-card" style="background: white; border-radius: 6px; border: 1px solid #e2e8f0; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
            <h3 class="chart-header" style="font-size: 0.85rem; font-weight: 600; color: #475569; text-transform: uppercase; margin-bottom: 16px; margin-top: 0;">Time by Day</h3>
            <div class="main-chart-container" style="height: 350px; width: 100%; position: relative;">
                <canvas id="stackedBarChart"></canvas>
            </div>
        </div>

        <!-- PROJECT DISTRIBUTION -->
        <div class="distribution-grid" style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-bottom: 24px;">
            <div class="chart-card" style="margin-bottom:0; background: white; border-radius: 6px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
                <h3 class="chart-header" style="font-size: 0.85rem; font-weight: 600; color: #475569; text-transform: uppercase; margin-bottom: 16px; margin-top: 0;">Project Distribution</h3>
                <div class="donut-container" style="height: 250px; position: relative; display: flex; justify-content: center; align-items: center;">
                    <canvas id="donutChart"></canvas>
                    <div class="donut-center-text" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;">
                        <div class="donut-center-val" id="donutTotal" style="font-size: 1.2rem; font-weight: 700; color: #0f172a;">--:--</div>
                        <div class="donut-center-lbl" style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase;">Total</div>
                    </div>
                </div>
            </div>
            <div class="chart-card" style="margin-bottom:0; background: white; border-radius: 6px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
                <h3 class="chart-header" style="font-size: 0.85rem; font-weight: 600; color: #475569; text-transform: uppercase; margin-bottom: 16px; margin-top: 0;">Project Ranking</h3>
                <div class="ranking-list" id="projectRankingList" style="max-height: 250px; overflow-y: auto; padding-right: 10px;">
                    <div style="color:#94a3b8; text-align:center; padding: 20px;">Memuatkan...</div>
                </div>
            </div>
        </div>

        <!-- TEAM ACTIVITIES (DENGAN SORTING & PAGINATION) -->
        <div class="glacier-card" style="margin-top: 0;">
            <h3 class="chart-header" style="font-size: 0.85rem; font-weight: 600; color: #475569; text-transform: uppercase; margin-bottom: 16px; margin-top: 0;">Team Activities</h3>
            
            <div class="table-container">
                <table class="team-table">
                    <thead>
                        <tr>
                            <!-- Pengepala dengan ciri Sorting -->
                            <th class="sortable-header" data-sort="member" style="width:30%;">
                                <div class="sort-content">
                                    TEAM MEMBER <span class="sort-icon">⇕</span>
                                </div>
                            </th>
                            <th class="sortable-header" data-sort="activity" style="width:40%;">
                                <div class="sort-content">
                                    LATEST ACTIVITY <span class="sort-icon">⇕</span>
                                </div>
                            </th>
                            <th class="sortable-header" data-sort="tracked" style="width:30%;">
                                <div class="sort-content">
                                    TOTAL TRACKED <span class="sort-icon">⇕</span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="teamActivitiesBody">
                        <tr><td colspan="3" style="text-align:center; color:#94a3b8; padding: 20px;">Memuatkan rekod pekerja...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- ================= BAR PAGINATION PREMIUM ================= -->
            <div class="glacier-pagination">
                <!-- Pilihan Jumlah Rekod (Kiri) -->
                <div class="page-size-selector">
                    <select id="recordsPerPage" class="pagination-select">
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="400">400</option>
                        <option value="all">ALL</option>
                    </select>
                </div>

                <!-- Kawalan Halaman (Kanan) -->
                <div class="page-controls">
                    <span class="page-text">Page</span>
                    
                    <div class="page-buttons">
                        <button class="page-btn" id="btnFirst" title="First Page">«</button>
                        <button class="page-btn" id="btnPrev" title="Previous Page">‹</button>
                        
                        <input type="number" id="currentPageInput" value="1" min="1" class="page-input">
                        
                        <button class="page-btn" id="btnNext" title="Next Page">›</button>
                        <button class="page-btn" id="btnLast" title="Last Page">»</button>
                    </div>

                    <span class="page-text">dari <span id="totalPages" style="font-weight: 600; color: #0f172a;">--</span> Total page</span>
                    <span class="total-records-text">[Total <span id="totalRecords" style="font-weight: 600; color: #0f172a;">--</span> recorded]</span>
                </div>
            </div>
        </div>

    </div>
    
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
