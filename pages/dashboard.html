<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WorkTime</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Wajib tambah Chart.js CDN untuk Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; background: #f4f7f6; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        
        .main-content { 
            position: absolute;
            top: 0;
            left: 250px;
            right: 0;
            padding: 24px 32px; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background: #f4f7f6;
        }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card { background: white; padding: 20px; border-radius: 6px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .card-title { font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        .card-value { font-size: 1.8rem; font-weight: 700; color: #0f172a; }
        
        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { 
            background: white; border-radius: 6px; border: 1px solid #e2e8f0; 
            height: 320px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: flex; flex-direction: column;
        }
        .chart-title { font-size: 0.9rem; font-weight: 600; color: #334155; margin-top: 0; margin-bottom: 15px; }
        .canvas-container { position: relative; height: 100%; width: 100%; flex: 1; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div class="header-flex">
            <h1 style="margin:0; font-size: 1.5rem; color:#0f172a; font-weight: 600;">Dashboard</h1>
            <span id="userEmail" style="color:#64748b; font-size:0.85rem;"></span>
        </div>

        <div class="grid-cards">
            <div class="card">
                <div class="card-title">Total Employees</div>
                <div class="card-value" id="countEmployees">⏳</div>
            </div>
            <div class="card">
                <div class="card-title">Active Projects</div>
                <div class="card-value" id="countProjects">⏳</div>
            </div>
            <div class="card">
                <div class="card-title">Pending Approvals</div>
                <div class="card-value" id="countApprovals">0</div>
            </div>
            <div class="card">
                <div class="card-title">My Hours (Today)</div>
                <div class="card-value" id="countMyHours" style="color: #0ea5e9;">⏳</div>
            </div>
        </div>

        <!-- Ruangan Carta Interaktif -->
        <div class="grid-charts">
            <div class="chart-box">
                <h3 class="chart-title">My Hours (Last 7 Days)</h3>
                <div class="canvas-container">
                    <canvas id="weeklyHoursChart"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <h3 class="chart-title">Time by Project (This Month)</h3>
                <div class="canvas-container">
                    <canvas id="projectsDoughnutChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
