<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WorkTime System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <!-- Tambah Chart.js untuk Carta Pai -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-container">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <h3>Dashboard</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                <!-- Metrics Grid -->
                <!-- Metrics Grid -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <h4>Total Employees</h4>
                        <h2 id="metricEmployees">...</h2>
                    </div>
                    <div class="metric-card">
                        <h4>Active Projects</h4>
                        <h2 id="metricProjects">...</h2>
                    </div>
                    <div class="metric-card">
                        <h4>Pending Approvals</h4>
                        <h2 id="metricApprovals">...</h2>
                    </div>
                    <div class="metric-card">
                        <h4>My Hours (Today)</h4>
                        <h2 id="metricHours">...</h2>
                    </div>
                </div>

                <!-- Weekly Stacked Bar Chart -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="weeklyBarChart"></canvas>
                    </div>
                </div>

                <!-- Lower Section: Pie Chart & Custom Task List -->
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; align-items: start;">
                    
                    <!-- Doughnut Pie Chart -->
                    <div class="card" style="height: 100%; display: flex; justify-content: center; align-items: center; position: relative;">
                        <div style="position: relative; height: 250px; width: 100%;">
                            <canvas id="taskPieChart"></canvas>
                        </div>
                    </div>

                    <!-- Custom Task Progress List -->
                    <div class="card" style="height: 100%;">
                        <div id="taskStatsList" style="display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; max-height: 280px; padding-right: 0.5rem;">
                            <p style="text-align: center; color: var(--text-muted);">Loading data...</p>
                        </div>
                    </div>
<!-- Team Activities Section -->
              <!-- Team Activities Section -->
                <div class="card" style="margin-top: 1.5rem; padding: 0; grid-column: 1 / -1; width: 100%;">
                    <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); background: #f8fafc; border-radius: 8px 8px 0 0;">
                        <h2 style="font-size: 1rem; color: #475569; text-transform: uppercase;">Team Activities</h2>
                    </div>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left;">
                            <thead>
                                <tr style="border-bottom: 1px solid var(--border-color); color: #94a3b8; text-transform: uppercase; font-size: 0.75rem;">
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Team Member</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Latest Activity</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Total Tracked (This Week)</th>
                                    <th style="padding: 1rem 1.5rem; width: 250px;"></th>
                                </tr>
                            </thead>
                            <tbody id="teamActivitiesList">
                                <tr><td colspan="4" style="padding: 1.5rem; text-align: center;">Loading team activities...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination Controls -->
                    <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: flex-start; gap: 1.5rem; background: #f8fafc; border-radius: 0 0 8px 8px;">
                        <div style="display: flex; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; background: white; align-items: center;">
                            <button id="prevPageBtn" style="padding: 0.4rem 0.8rem; border: none; background: transparent; cursor: pointer; border-right: 1px solid var(--border-color); color: #64748b; font-weight: bold;">&lt;</button>
                            <div id="pageInfo" style="padding: 0.4rem 1rem; border-right: 1px solid var(--border-color); font-size: 0.85rem; color: #334155; min-width: 80px; text-align: center;">0-0 of 0</div>
                            <button id="nextPageBtn" style="padding: 0.4rem 0.8rem; border: none; background: transparent; cursor: pointer; color: #64748b; font-weight: bold;">&gt;</button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <select id="itemsPerPageSelect" style="padding: 0.4rem; border: 1px solid var(--border-color); border-radius: 4px; background: white; font-size: 0.85rem; color: #334155; cursor: pointer;">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                            <span style="font-size: 0.85rem; color: #64748b;">Items per page</span>
                        </div>
                    </div>
                </div>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
