<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - WorkTime</title>
    <!-- Rujukan Tunggal ke style.css -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar dimuatkan di sini -->
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <div class="top-header">
                <h1 class="page-title">Tags</h1>
                <span id="userEmail" style="color:#64748b; font-size:0.85rem;">Loading...</span>
            </div>

            <div class="content-area">

                <!-- Bar Tindakan: Search & Add Tag (GLACIER CARD) -->
                <div class="glacier-card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 24px;">
                    <!-- Kiri: Filter & Search -->
                    <div style="display: flex; gap: 15px; width: 40%;">
                        <select style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; color: #475569; outline: none; background: white;">
                            <option>Show active</option>
                        </select>
                        <div style="flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; background: white;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="searchTagInput" placeholder="Search by name" style="border: none; outline: none; padding: 10px; width: 100%; font-size: 0.9rem; background: transparent;">
                        </div>
                    </div>
                    
                    <!-- Kanan: Add New Tag -->
                    <div style="display: flex; gap: 0;">
                        <input type="text" id="newTagInput" placeholder="Add new tag" style="padding: 10px 16px; border: 1px solid #cbd5e1; border-right: none; outline: none; border-radius: 8px 0 0 8px; width: 250px;">
                        <button id="addTagBtn" class="btn-primary" style="border-radius: 0 8px 8px 0 !important; padding: 10px 24px !important;">ADD</button>
                    </div>
                </div>

                <!-- Jadual Tags (GLACIER CARD) -->
                <div class="glacier-card" style="padding: 0; overflow: hidden;">
                    <div style="overflow-x: auto;">
                        <table class="team-table">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"><input type="checkbox"></th>
                                    <th>Name</th>
                                    <th style="text-align: right; padding-right: 24px;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tagsTableBody">
                                <tr><td colspan="3" style="text-align: center; padding: 2rem; color: #888;">Loading tags...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <script type="module" src="../js/tags.js"></script>
</body>
</html>
