<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - WorkTime System</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
</head>
<body>

    <div class="app-container">
       <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <h3>Reports</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                <div class="filter-card">
                    <h2>Time Entries Report</h2>
                    <div class="filter-grid" style="margin-top: 1rem;">
                        <div class="filter-group">
                            <label>Date From</label>
                            <input type="date" id="dateFrom">
                        </div>
                        <div class="filter-group">
                            <label>Date To</label>
                            <input type="date" id="dateTo">
                        </div>
                        <div class="filter-group">
                            <label>Employee</label>
                            <select id="empSelect"><option value="">All Employees</option></select>
                        </div>
                        <div class="filter-group">
                            <label>Project</label>
                            <select id="projSelect"><option value="">All Projects</option></select>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button id="generateBtn" class="btn-action btn-generate">Generate Report</button>
                        <button id="exportBtn" class="btn-action btn-export" style="display: none;">Export to CSV</button>
                    </div>
                </div>

                <div id="summaryBox" class="summary-box" style="display: none;">
                    Total Tracked Time: <span id="totalHours">00:00</span>
                </div>

                <div class="table-container">
                    <table id="reportTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Employee</th>
                                <th>Project</th>
                                <th>Task</th>
                                <th>Duration</th>
                                <th>Source</th>
                            </tr>
                        </thead>
                        <tbody id="reportList">
                            <tr><td colspan="6" style="text-align: center;">Select filters and click Generate Report</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/reports.js"></script>
</body>
</html>
