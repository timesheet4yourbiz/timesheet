<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - WorkTime System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
</head>
<body>

    <div class="app-container">
       <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <h3>Attendance</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                <div class="attendance-card">
                    <div class="status-badge" id="todayStatus">Status: Checking...</div>
                    <div class="time-display" id="liveTime">00:00:00</div>
                    <div class="date-display" id="liveDate">Loading date...</div>
                    
                    <div class="action-buttons">
                        <button id="clockInBtn" class="btn-attendance btn-clock-in" disabled>Clock In</button>
                        <button id="clockOutBtn" class="btn-attendance btn-clock-out" disabled>Clock Out</button>
                    </div>
                </div>

                <div class="card">
                    <h2>My Attendance History</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Clock In</th>
                                    <th>Clock Out</th>
                                    <th>Worked Time</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceHistory">
                                <tr><td colspan="5">Loading history...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/attendance.js"></script>
</body>
</html>
