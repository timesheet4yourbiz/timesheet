<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - WorkTime System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
</head>
<body>

    <div class="app-container">
       <div id="sidebar-container"></div>
<main class="main-content">
    <header class="topbar">
        <h3>Attendance</h3>
        <span id="userEmail" class="user-info">Loading...</span>
    </header>

    <div class="content-area">
        <!-- Kad Clock In / Out -->
        <div class="card" style="padding: 2rem; text-align: center; margin-bottom: 2rem; background: white; border-radius: 8px;">
            <h2 id="currentClock" style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--text-main);">00:00:00</h2>
            <p id="currentDate" style="color: var(--text-muted); margin-bottom: 2rem;">Loading date...</p>
            
            <button id="clockBtn" style="padding: 1rem 3rem; font-size: 1.2rem; font-weight: bold; border-radius: 50px; border: none; cursor: pointer; background: var(--primary-color); color: white; transition: 0.3s;">
                Loading...
            </button>
        </div>

        <!-- Jadual Sejarah Kehadiran -->
        <div class="card" style="padding: 1.5rem;">
            <h4 style="margin-top:0; color: var(--text-muted); font-size: 0.9rem;">MY ATTENDANCE LOG</h4>
            <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                <thead>
                    <tr style="text-align: left; border-bottom: 1px solid var(--border-color); background: #f8fafc;">
                        <th style="padding: 0.75rem;">Date</th>
                        <th style="padding: 0.75rem;">Clock In</th>
                        <th style="padding: 0.75rem;">Clock Out</th>
                        <th style="padding: 0.75rem;">Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <!-- Data masuk dari JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>
    </div>

    <script type="module" src="../js/attendance.js"></script>
</body>
</html>
