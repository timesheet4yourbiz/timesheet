<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet - WorkTime System</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
</head>
<body>

    <div class="app-container">
       <div id="sidebar-container"></div>  
        <main class="main-content">
            <header class="topbar">
                <h3>Timesheet</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                <div class="timesheet-header">
                    <div class="week-nav">
                        <button id="prevWeek" class="btn-nav">&lt; Prev</button>
                        <strong id="weekLabel">Loading Week...</strong>
                        <button id="nextWeek" class="btn-nav">Next &gt;</button>
                        <button id="thisWeek" class="btn-nav">This Week</button>
                    </div>
                    <button id="saveBtn" class="btn-save">Save Timesheet</button>
                </div>

                <div class="table-container">
                    <table id="timesheetTable">
                        <thead>
                            <tr id="daysHeader">
                                <th class="col-task">Project / Task</th>
                                <th>Mon<br><small>-</small></th>
                                <th>Tue<br><small>-</small></th>
                                <th>Wed<br><small>-</small></th>
                                <th>Thu<br><small>-</small></th>
                                <th>Fri<br><small>-</small></th>
                                <th>Sat<br><small>-</small></th>
                                <th>Sun<br><small>-</small></th>
                               <th>Total</th>
<th style="width: 40px; text-align: center;">🗑️</th>
                            </tr>
                        </thead>
                        <tbody id="timesheetBody">
                            <!-- Rows will be populated here -->
                        </tbody>
                        <tfoot>
                            <tr>
                                <td class="col-task total-cell" style="text-align: right;">Daily Total:</td>
                                <td class="total-cell" id="tot-0">00:00</td>
                                <td class="total-cell" id="tot-1">00:00</td>
                                <td class="total-cell" id="tot-2">00:00</td>
                                <td class="total-cell" id="tot-3">00:00</td>
                                <td class="total-cell" id="tot-4">00:00</td>
                                <td class="total-cell" id="tot-5">00:00</td>
                                <td class="total-cell" id="tot-6">00:00</td>
                                <td class="total-cell" id="tot-week">00:00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem; align-items: center;">
                    <button id="addRowBtn" class="btn-add-row">+ Add Task Row</button>
                    <select id="copyLastWeekSelect" class="btn-add-row" style="background: white; color: #3b82f6; border: 1px solid #3b82f6; cursor: pointer;">
                        <option value="" disabled selected>Copy last week ▾</option>
                        <option value="task_only">Copy activities only</option>
                        <option value="task_time">Copy activities and time</option>
                    </select>
                </div>
                
            </div>
        </main>
    </div>

    <script type="module" src="../js/timesheet.js"></script>
</body>
</html>
