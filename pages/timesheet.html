<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet - WorkTime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar dimuatkan di sini -->
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <header class="topbar">
                <h3>Timesheet</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                
                <!-- Kawalan Atas: Tajuk & Filter Minggu -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; font-size: 1.5rem; color: var(--text-main); font-weight: 400;">Timesheet</h2>
                    
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select style="padding: 8px 15px; border: 1px solid #cbd5e1; border-radius: 4px; color: #475569; outline: none; background: white;">
                            <option>Teammates</option>
                        </select>
                        
                        <button style="padding: 8px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 4px; color: #64748b; cursor: pointer;">
                            ☰
                        </button>
                        
                        <div style="display: flex; border: 1px solid #cbd5e1; border-radius: 4px; background: white; overflow: hidden;">
                            <div id="weekDateRange" style="padding: 8px 15px; border-right: 1px solid #cbd5e1; color: #475569; display: flex; align-items: center; gap: 8px;">
                                📅 Memuatkan...
                            </div>
                            <button id="prevWeekBtn" style="padding: 8px 12px; background: white; border: none; border-right: 1px solid #cbd5e1; cursor: pointer; color: #64748b;">&lt;</button>
                            <button id="nextWeekBtn" style="padding: 8px 12px; background: white; border: none; cursor: pointer; color: #64748b;">&gt;</button>
                        </div>
                    </div>
                </div>

                <!-- Jadual Timesheet Mingguan -->
                <div class="card" style="padding: 0; background: white; border-radius: 4px; border: 1px solid var(--border-color); overflow: hidden; margin-bottom: 15px;">
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: center;">
                            <thead>
                                <tr id="timesheetHeadRow" style="border-bottom: 1px solid var(--border-color); background: #f8fafc; color: #94a3b8; font-size: 0.8rem;">
                                    <!-- JS akan isikan hari Isnin-Ahad di sini -->
                                </tr>
                            </thead>
                            <tbody id="timesheetTableBody">
                                <!-- JS akan isikan senarai Projek & Masa di sini -->
                            </tbody>
                            <tfoot id="timesheetFootRow">
                                <!-- JS akan isikan jumlah besar mingguan di sini -->
                            </tfoot>
                        </table>
                    </div>
                </div>
                
                <!-- Butang Tindakan Bawah -->
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button id="addNewRowBtn" style="display: none; padding: 8px 15px; background: white; border: 1px solid #0ea5e9; color: #0ea5e9; border-radius: 4px; cursor: pointer;">
    ⊕ Add new row
</button>
                    
                    <!-- NATIVE SELECT DROPDOWN COPY LAST WEEK -->
                    <select id="copyLastWeekSelect" style="padding: 8px 15px; background: white; border: 1px solid #cbd5e1; color: #475569; border-radius: 4px; cursor: pointer; outline: none; font-size: 0.85rem; font-family: inherit;">
                        <option value="" disabled selected>📄 Copy last week ▼</option>
                        <option value="activities">Copy activities only</option>
                        <option value="all">Copy activities and time</option>
                    </select>

                    <button id="saveTemplateBtn" style="padding: 8px 15px; background: white; border: 1px solid #cbd5e1; color: #475569; border-radius: 4px; cursor: pointer;">
                        💾 Save as template
                    </button>

                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../js/timesheet.js"></script>
</body>
</html>
