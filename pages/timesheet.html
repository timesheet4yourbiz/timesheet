<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet - WorkTime System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Utama Sahaja -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="app-container">
        <div id="sidebar-container"></div>  
        
        <main class="main-content">
            <header class="topbar">
                <h3>My Timesheet</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                <div class="card" style="padding: 1.5rem; background: white; border-radius: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h4 style="margin:0; color: var(--text-muted); font-size: 0.9rem;">TIME ENTRIES LOG</h4>
                        <div id="totalHours" style="font-weight: 600; color: var(--primary-color); background: #ecfdf5; padding: 0.5rem 1rem; border-radius: 6px;">
                            Total: 0 hrs 0 mins
                        </div>
                    </div>
                    
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="text-align: left; border-bottom: 1px solid var(--border-color); background: #f8fafc;">
                                <th style="padding: 0.75rem; color: var(--text-muted);">Date</th>
                                <th style="padding: 0.75rem; color: var(--text-muted);">Project</th>
                                <th style="padding: 0.75rem; color: var(--text-muted);">Task Description</th>
                                <th style="padding: 0.75rem; color: var(--text-muted);">Duration</th>
                            </tr>
                        </thead>
                        <tbody id="timesheetTableBody">
                            <!-- Data ditarik oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/timesheet.js"></script>
</body>
</html>
