<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approvals - WorkTime System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
</head>
<body>

    <div class="app-container">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <h3>Approvals</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                
                <!-- Action for Employee -->
                <div class="card">
                    <h2>Submit Timesheet for Approval</h2>
                    <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1rem;">
                        <input type="date" id="weekSelect" style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                        <button id="submitWeekBtn" class="btn-sm btn-submit">Submit Week</button>
                    </div>
                    <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Select any date in the week you want to submit.</small>
                </div>

                <!-- Approval List -->
                <div class="card">
                    <h2>Timesheet Submissions</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Week Start</th>
                                    <th>Status</th>
                                    <th>Submitted At</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="approvalList">
                                <tr><td colspan="5">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Reject Modal -->
    <div id="rejectModal" class="modal">
        <div class="modal-content">
            <h3>Reject Timesheet</h3>
            <label>Reason (Required):</label>
            <textarea id="rejectReason" rows="3" placeholder="Explain why this is rejected..."></textarea>
            <div style="display: flex; gap: 1rem;">
                <button id="confirmRejectBtn" class="btn-sm btn-reject" style="flex: 1;">Confirm Reject</button>
                <button id="cancelRejectBtn" class="btn-sm" style="flex: 1; background: var(--text-muted);">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/approvals.js"></script>
</body>
</html>
