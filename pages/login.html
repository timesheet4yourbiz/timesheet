<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WorkTime</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Tetapan khusus untuk halaman Login */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; }
        
        /* Container Latar Belakang (Boleh ditukar via JS) */
        #loginBg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2069&auto=format&fit=crop'); /* Gambar placeholder lalai */
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Lapisan gelap supaya kad login lebih menonjol */
        #loginBg::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); /* Warna gelap transparent */
            z-index: 1;
        }

        .login-card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 400px;
            z-index: 2; /* Pastikan ia berada di atas lapisan gelap */
            position: relative;
        }

        /* Logo (Boleh ditukar via JS) */
        #companyLogo {
            display: block;
            margin: 0 auto 1.5rem auto;
            max-width: 180px;
            height: 50px;
            object-fit: contain;
        }

        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h2 { margin: 0 0 0.5rem 0; color: #1e293b; font-size: 1.5rem; }
        .login-header p { margin: 0; color: #64748b; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 0.5rem; font-weight: 500; }
        .form-control {
            width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px;
            font-family: inherit; font-size: 0.95rem; box-sizing: border-box; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #03a9f4; outline: none; }

        .btn-login {
            width: 100%; background: #03a9f4; color: white; padding: 0.75rem; border: none;
            border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: background 0.2s; margin-top: 0.5rem;
        }
        .btn-login:hover { background: #0288d1; }
    </style>
</head>
<body>

    <div id="loginBg">
        <div class="login-card">
            
            <!-- Tempat letak Logo (URL Placeholder) -->
            <img id="companyLogo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Logo_TV_2015.png/250px-Logo_TV_2015.png" alt="Company Logo">
            
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
            </form>
            
            <!-- Elemen untuk papar error -->
            <div id="errorMessage" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none;"></div>
        </div>
    </div>

    <script type="module" src="../js/login.js"></script>
</body>
</html>
