<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - WorkTime</title>
    <!-- Pastikan fail CSS dipanggil -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>
    
    <!-- KANDUNGAN UTAMA -->
    <div class="main-content">
        <div class="top-header">
            <h1 class="page-title">System Settings</h1>
            <span id="userEmail" style="color:#64748b; font-size:0.85rem;"></span>
        </div>

        <!-- KOTAK GLACIER SETTINGS -->
        <!-- Saya hadkan kelebaran kotak supaya tak meregang hodoh di skrin besar -->
        <div class="glacier-card" style="max-width: 650px; margin-top: 0;">
            <h2 style="font-size: 1.1rem; font-weight: 600; color: #1e293b; margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
                Appearance
            </h2>
            
            <form id="settingsForm">
                
                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; color: #475569; margin-bottom: 8px;">Company Logo URL</label>
                    <input type="text" id="logoUrl" placeholder="https://example.com/logo.png" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; box-sizing: border-box;" onfocus="this.style.borderColor='#0ea5e9'" onblur="this.style.borderColor='#cbd5e1'">
                    <span style="font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 6px;">Tampal link imej logo yang telus (transparent background).</span>
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; color: #475569; margin-bottom: 8px;">Login Background URL</label>
                    <input type="text" id="bgUrl" placeholder="https://example.com/background.jpg" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; box-sizing: border-box;" onfocus="this.style.borderColor='#0ea5e9'" onblur="this.style.borderColor='#cbd5e1'">
                    <span style="font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 6px;">Tampal link imej resolusi tinggi untuk latar belakang halaman login.</span>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 0.9rem; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px;">
                    Save Settings
                </button>

            </form>
        </div>
    </div>
    
    <!-- Skrip untuk memanggil fungsi logik dan Sidebar -->
    <!-- Pastikan nama fail js adalah tepat (cth: settings.js) -->
    <script type="module" src="../js/settings.js"></script>
</body>
</html>
