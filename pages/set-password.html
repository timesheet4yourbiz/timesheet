<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - WorkTime</title>
    <style>
        body { margin: 0; background: #f4f7f6; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #334155; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #0f172a; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none; }
        input:focus { border-color: #0ea5e9; }
        button { width: 100%; background: #0ea5e9; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; }
        .loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to WorkTime</h1>
        <p>Please set a secure password for your account to continue.</p>
        
        <form id="pwdForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPwd" placeholder="Minimum 6 characters" required minlength="6">
            </div>
            <button type="submit" id="btnSave">Save Password & Login</button>
        </form>
    </div>

    <!-- Panggil Supabase & Logik -->
    <script type="module">
        import { supabase } from '../js/supabase.js';

        document.getElementById('pwdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('newPwd').value;
            const btn = document.getElementById('btnSave');
            
            btn.textContent = 'Saving...';
            btn.classList.add('loading');

            // Fungsi ini akan terus kemas kini password staf dalam pangkalan data
            const { data, error } = await supabase.auth.updateUser({
                password: pwd
            });

            if (error) {
                alert("Error setting password: " + error.message);
                btn.textContent = 'Save Password & Login';
                btn.classList.remove('loading');
            } else {
                alert("Success! Your password has been set.");
                window.location.href = 'dashboard.html'; // Bawa terus ke dashboard!
            }
        });
    </script>
</body>
</html>
