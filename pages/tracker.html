<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker - WorkTime</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
   
</head>
<body>

    <div class="app-container">
       <!-- Sidebar Seragam Dengan Kategori -->
        <div id="sidebar-container"></div>        
        <main class="main-content">
    <header class="topbar">
        <h3>Time Tracker</h3>
        <span id="userEmail" class="user-info">Loading...</span>
    </header>

    <div class="content-area">
        <!-- Tracker Bar -->
        <div class="tracker-bar">
            <input type="text" id="taskDescription" class="form-control" placeholder="What are you working on?" style="flex: 2; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 6px;">
            
            <div class="tracker-selects">
                <select id="projectSelect">
                    <option value="">Select Project</option>
                </select>
            </div>

            <div id="timerDisplay" class="timer-display">00:00:00</div>
            
            <button id="startStopBtn" class="btn-start">Start</button>
        </div>

        <!-- Recent Entries Table -->
        <div class="card" style="padding: 1.5rem; background: white; border-radius: 8px;">
            <h4 style="margin-top:0; color: var(--text-muted); font-size: 0.9rem;">RECENT TIME ENTRIES</h4>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 1px solid var(--border-color);">
                        <th style="padding: 0.75rem;">Description</th>
                        <th style="padding: 0.75rem;">Project</th>
                        <th style="padding: 0.75rem;">Duration</th>
                        <th style="padding: 0.75rem; text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="trackerEntriesList">
                    <!-- Data ditarik via JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>
    </div>

    <script type="module" src="../js/tracker.js"></script>
</body>
</html>
