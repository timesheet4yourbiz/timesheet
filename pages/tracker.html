<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker - WorkTime</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* CSS Khusus untuk Time Tracker Bar */
        .tracker-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tracker-selects {
            display: flex;
            flex: 1;
            gap: 1rem;
            min-width: 300px;
        }
        .tracker-selects select {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-main);
            background-color: #f8fafc;
            outline: none;
            transition: border 0.2s;
        }
        .tracker-selects select:focus {
            border-color: var(--primary-color);
            background-color: white;
        }
        .timer-display {
            font-size: 1.5rem; /* Saiz fon dikecilkan agar kemas */
            font-weight: 600;
            font-variant-numeric: tabular-nums; /* Elak nombor bergoyang bila berubah */
            color: var(--text-main);
            min-width: 120px;
            text-align: center;
            letter-spacing: -0.02em;
        }
        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-start:hover {
            background-color: var(--primary-hover);
        }
        .btn-start.stop-mode {
            background-color: #ef4444; /* Merah untuk butang Stop */
        }
        .btn-start.stop-mode:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="app-container">
       <!-- Sidebar Seragam Dengan Kategori -->
        <div id="sidebar-container"></div>        
        <main class="main-content">
            <header class="topbar">
                <h3>Time Tracker</h3>
                <div class="user-info"><span id="userEmail">Loading...</span></div>
            </header>

            <div class="content-area">
                
                <!-- Sleek Tracker Bar -->
                <div class="tracker-bar">
                    <div class="tracker-selects">
                        <select id="projectSelect">
                            <option value="">Select Project...</option>
                        </select>
                        <select id="taskSelect">
                            <option value="">Select Task...</option>
                        </select>
                    </div>
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                    <button id="startBtn" class="btn-start">START</button>
                </div>

                <!-- Recent Entries Table -->
                <div class="card" style="padding: 0;">
                    <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); background: #f8fafc; border-radius: 8px 8px 0 0;">
                        <h2 style="font-size: 1rem; color: #475569; text-transform: uppercase; margin: 0;">Recent Time Entries</h2>
                    </div>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left;">
                            <thead>
                                <tr style="border-bottom: 1px solid var(--border-color); color: #94a3b8; text-transform: uppercase; font-size: 0.75rem;">
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Project</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Task</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Start Time</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">End Time</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600;">Duration</th>
                                </tr>
                            </thead>
                            <tbody id="recentEntriesList">
                                <tr><td colspan="5" style="padding: 1.5rem; text-align: center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="../js/tracker.js"></script>
</body>
</html>
