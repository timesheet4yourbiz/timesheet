<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WorkTime System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8fafc; margin: 0; font-family: 'Inter', sans-serif;">
    
    <div class="card" style="padding: 2rem; width: 100%; max-width: 400px; text-align: center; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
        <h2 style="margin-bottom: 1.5rem; color: var(--text-main);">Join WorkTime</h2>
        
        <form id="registerForm" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="email" id="regEmail" placeholder="Email Address" required style="padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem;">
            <input type="password" id="regPassword" placeholder="Password (Min 6 characters)" required minlength="6" style="padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem;">
            <button type="submit" id="regBtn" class="btn-primary" style="padding: 0.8rem; font-size: 1rem; border: none; cursor: pointer;">Register Account</button>
        </form>

        <div id="regMessage" style="margin-top: 1.5rem; color: #10b981; font-weight: 500; display: none; line-height: 1.5;"></div>
        
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Login here</a>
        </p>
    </div>

    <script type="module" src="../js/register.js"></script>
</body>
</html>
