<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - WorkTime System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .table-container { overflow-x: auto; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--bg-color); font-weight: 600; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .btn-sm { padding: 0.5rem 1rem; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 8px; width: 400px; max-width: 90%; }
        .modal-content h3 { margin-bottom: 1rem; }
        .btn-cancel { background: var(--text-muted); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>WorkTime</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="#" class="nav-item">Time Tracker</a>
                <a href="#" class="nav-item">Timesheet</a>
                <a href="employees.html" class="nav-item">Employees</a>
                <a href="departments.html" class="nav-item active">Departments</a>
                <a href="#" class="nav-item">Projects</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h3>Departments</h3>
                <div class="user-info">
                    <span id="userEmail">Loading...</span>
                </div>
            </header>

            <div class="content-area">
                <div class="card">
                    <div class="header-actions">
                        <h2>Department List</h2>
                        <button id="addDeptBtn" class="btn-sm">+ Add Department</button>
                    </div>
                    
                    <div class="table-container">
                        <table id="deptTable">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Department Name</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="deptList">
                                <tr><td colspan="3">Loading departments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Department Modal -->
    <div id="deptModal" class="modal">
        <div class="modal-content">
            <h3>Add New Department</h3>
            <form id="deptForm">
                <div class="form-group">
                    <label>Department Code</label>
                    <input type="text" id="deptCode" required placeholder="e.g. IT, HR, FIN">
                </div>
                <div class="form-group">
                    <label>Department Name</label>
                    <input type="text" id="deptName" required placeholder="Information Technology">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" id="saveBtn" class="btn-sm" style="flex: 1;">Save</button>
                    <button type="button" id="closeModalBtn" class="btn-sm btn-cancel" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/departments.js"></script>
</body>
</html>
