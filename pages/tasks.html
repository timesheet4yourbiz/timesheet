<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - WorkTime System</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Seragam Dengan Kategori -->
        <div id="sidebar-container"></div>        <!-- Main Content -->
<main class="main-content">
    <header class="topbar">
        <h3>Task Management</h3>
        <span id="userEmail" class="user-info">Loading...</span>
    </header>

    <div class="content-area">
        <!-- Borang Tambah Tugasan -->
        <div class="card" style="padding: 1.5rem; margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem;">
                <select id="projectSelect" style="flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 6px;">
                    <option value="">Select Project...</option>
                </select>
                <input type="text" id="taskNameInput" placeholder="New Task Name" style="flex: 2; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <button id="addTaskBtn" class="btn-primary">Add Task</button>
            </div>
        </div>

        <!-- Jadual Tugasan -->
        <div class="card" style="padding: 1.5rem;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 1px solid var(--border-color); background: #f8fafc;">
                        <th style="padding: 0.75rem;">Project</th>
                        <th style="padding: 0.75rem;">Task Name</th>
                        <th style="padding: 0.75rem;">Status</th>
                        <th style="padding: 0.75rem; text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody">
                    <!-- Data ditarik oleh JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>
    </div>

    <!-- Add Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>Add New Task</h3>
            <form id="taskForm">
                <div class="form-group">
                    <label>Project</label>
                    <select id="taskProject" required style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border-color);">
                        <option value="">Loading projects...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Task Code</label>
                    <input type="text" id="taskCode" required placeholder="TSK-001">
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="taskName" required placeholder="Design Mockup">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" id="saveBtn" class="btn-sm" style="flex: 1;">Save</button>
                    <button type="button" id="closeModalBtn" class="btn-sm btn-cancel" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/tasks.js"></script>
</body>
</html>
